name: Deploy Hugo site to Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.168.0
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Fetch News Data
        run: |
          mkdir -p static/data
          curl -s "https://api.rss2json.com/v1/api.json?rss_url=https%3A%2F%2Fwww.republika.co.id%2Frss%2Fkhazanah" > r1.json
          curl -s "https://api.rss2json.com/v1/api.json?rss_url=https%3A%2F%2Fmuslim.or.id%2Ffeed" > r2.json
          curl -s "https://api.rss2json.com/v1/api.json?rss_url=https%3A%2F%2Frumaysho.com%2Ffeed" > r3.json
          jq -s 'map(select(.status == "ok") | .items) | add' r1.json r2.json r3.json > static/data/berita.json || echo "[]" > static/data/berita.json

      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: |
          hugo \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4