title: "Kalkulator Zakat Pertanian" 
--- 
<p>Zakat pertanian dikeluarkan dari hasil panen. Jika menggunakan irigasi (biaya), zakatnya 5%%. Jika tadah hujan (tanpa biaya), zakatnya 10%%.</p>
