title: "Kalkulator Zakat Penghasilan" 
--- 
<p>Zakat penghasilan adalah zakat yang dikeluarkan dari gaji atau pendapatan rutin. Nisabnya setara dengan 85 gram emas per tahun (atau sekitar 522 kg beras).</p>
