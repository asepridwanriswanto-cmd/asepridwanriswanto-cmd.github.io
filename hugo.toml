baseURL = "https://syahida.web.id/"
title = "Syahida"
theme = "papermod"
enableRobotsTXT = true

[params]
  env = "production"
  favicon = "favicon.svg"
  author = "Abdul Manan"
  description = "Syahida adalah platform alat bantu Islami untuk umat Muslim Indonesia. Menyediakan kalkulator zakat dan waris, jadwal salat, arah kiblat, Al-Qur'an digital, hadis, doa, dzikir, dan kalender Hijriah"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = false

  [params.label]
    text = "Syahida"
    icon = "images/logo-syahida.svg"
    iconHeight = 32

[security]
  allowContent = ['text/html', 'text/markdown']

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

