baseURL = "https://syahida.web.id/"
title = "Syahida"
theme = "papermod"
enableRobotsTXT = true

[params]
  favicon = "favicon.svg"
  author = "Abdul Manan"
  description = "Sahabat harian Muslim Indonesia: artikel, kalkulator zakat & waris, artikel, hadits shahih, doa harian, arah kiblat, jadwal sholat, dan kalender Islam."
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = false

  [params.label]
    text = "Syahida"
    icon = "images/logo-syahida.svg"
    iconHeight = 32

[security]
  allowContent = ['text/html', 'text/markdown']

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[menu]
  [[menu.main]]
    name = "Beranda"
    url = "/"
    weight = 10
  [[menu.main]]
    name = "Artikel"
    url = "/artikel/"
    weight = 20
  [[menu.main]]
    name = "Informasi"
    url = "/informasi/"
    weight = 25
  [[menu.main]]
    name = "Fitur"
    url = "/fitur/"
    weight = 30
    
  # MENU FOOTER
  [[menu.footer]]
    name = "Tentang"
    url = "/tentang/"
    weight = 10
  [[menu.footer]]
    name = "Kontak"
    url = "/kontak/"
    weight = 20
  [[menu.footer]]
    name = "Disclaimer"
    url = "/disclaimer/"
    weight = 30
  [[menu.footer]]
    name = "Kebijakan Privasi"
    url = "/privacy-policy/"
