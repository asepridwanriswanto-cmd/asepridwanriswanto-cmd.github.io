baseURL = "https://asepridwanriswanto-cmd.github.io/"
languageCode = "id"
title = "SahabatMuslim"
theme = "papermod"
enableRobotsTXT = true

[params]
  author = "SahabatMuslim"
  description = "Sahabat harian Muslim Indonesia: berita Islam, kalkulator zakat & waris, artikel, hadits shahih, doa harian, arah kiblat, jadwal sholat, dan kalender Islam."
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = false

[security]
  allowContent = ['text/html', 'text/markdown']

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

