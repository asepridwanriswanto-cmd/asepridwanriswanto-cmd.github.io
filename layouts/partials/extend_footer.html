<style>
  .share-btn {
    display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; 
    background: #ffffff; color: #555555; text-decoration: none; 
    border: 1px solid #dddddd; border-radius: 20px; font-size: 0.85em; 
    font-weight: 600; transition: all 0.3s ease; cursor: pointer;
  }
  .share-btn:hover {
    background: #f8f9fa; border-color: #0E7A5F; color: #0E7A5F;
    transform: translateY(-2px); box-shadow: 0 4px 8px rgba(0,0,0,0.1);
  }
</style>

<div id="custom-share-container" style="display: none; max-width: 800px; margin: 50px auto 20px auto; padding: 20px; border-top: 1px solid #eee; text-align: center;">
  <p style="font-size: 0.9em; color: #666; margin-bottom: 15px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px;">Bagikan Halaman Ini:</p>
  <div style="display: flex; justify-content: center; flex-wrap: wrap; gap: 10px;">
    
    <a class="share-btn" id="share-wa" href="#" target="_blank" rel="noopener noreferrer" data-no-instant>💬 WhatsApp</a>
    <a class="share-btn" id="share-fb" href="#" target="_blank" rel="noopener noreferrer" data-no-instant>🔵 Facebook</a>
    <a class="share-btn" id="share-x" href="#" target="_blank" rel="noopener noreferrer" data-no-instant>𝕏 X / Twitter</a>
    <a class="share-btn" id="share-tg" href="#" target="_blank" rel="noopener noreferrer" data-no-instant>✈️ Telegram</a>
    <a class="share-btn" id="share-th" href="#" target="_blank" rel="noopener noreferrer" data-no-instant>🧵 Threads</a>

  </div>
</div>

<script>
  document.addEventListener("DOMContentLoaded", function() {
    const path = window.location.pathname;
    // Daftar halaman yang dipasangi tombol share
    const targetPages = ["/jadwal-sholat/", "/zakat/"];
    const isTargetPage = targetPages.some(page => path.includes(page));

    if (isTargetPage) {
      const container = document.getElementById("custom-share-container");
      if (container) container.style.display = "block";

      const pUrl = encodeURIComponent(window.location.href);
      const pTitle = encodeURIComponent(document.title);
      
      // Mengisi link URL ke masing-masing tombol
      document.getElementById("share-wa").href = "https://wa.me/?text=" + pTitle + "%20" + pUrl;
      document.getElementById("share-fb").href = "https://www.facebook.com/sharer/sharer.php?u=" + pUrl;
      document.getElementById("share-x").href = "https://twitter.com/intent/tweet?text=" + pTitle + "&url=" + pUrl;
      document.getElementById("share-tg").href = "https://t.me/share/url?url=" + pUrl + "&text=" + pTitle;
      document.getElementById("share-th").href = "https://threads.net/intent/post?text=" + pTitle + "%20" + pUrl;

      // Pindahkan tombol ke tepat di bawah konten utama
      const postContent = document.querySelector(".post-content");
      if (postContent && container) {
                postContent.appendChild(container); // Menempelkan di dalam kotak konten, di bagian paling bawah
                 }

      // TRIK PEMAKSA: Buka tab baru secara manual agar tidak dicegat InstantClick
      const shareBtns = document.querySelectorAll(".share-btn");
      shareBtns.forEach(btn => {
        btn.addEventListener("click", function(e) {
          e.preventDefault(); 
          e.stopPropagation(); // Hentikan penyebaran event ke InstantClick
          window.open(this.href, '_blank'); // Buka paksa di tab baru
        });
      });
    }
  });
</script>

<script>
  document.addEventListener("DOMContentLoaded", function() {
    // Hanya jalankan di layar HP
    if (window.innerWidth <= 768) {
      const menu = document.querySelector("#menu");
      const header = document.querySelector(".header");
      
      if (menu && header && !document.querySelector(".custom-hamburger")) {
        // Buat tombol garis tiga
        const btn = document.createElement("button");
        btn.innerHTML = "☰";
        btn.className = "custom-hamburger";
        btn.style.cssText = "font-size: 2rem; background: none; border: none; color: var(--primary); cursor: pointer; margin-left: auto; padding: 0 10px;";

        // Taruh tombol di header
        header.style.display = "flex";
        header.style.alignItems = "center";
        header.appendChild(btn);

        // Logika buka/tutup menu saat tombol diklik
        btn.addEventListener("click", function(e) {
          e.preventDefault();
          menu.classList.toggle("show-menu");
        });
      }
    }
  });
</script>

<!-- TAUTAN FOOTER MANUAL (Elegan) -->
<div id="custom-footer-links" style="display: flex; justify-content: center; flex-wrap: wrap; gap: 20px; margin-bottom: 15px; font-size: 0.85em; font-family: sans-serif;">
  <a href="/tentang/" style="color: #666; text-decoration: none; transition: color 0.3s;" onmouseover="this.style.color='#0E7A5F'" onmouseout="this.style.color='#666'">Tentang</a>
  <a href="/kontak/" style="color: #666; text-decoration: none; transition: color 0.3s;" onmouseover="this.style.color='#0E7A5F'" onmouseout="this.style.color='#666'">Kontak</a>
  <a href="/disclaimer/" style="color: #666; text-decoration: none; transition: color 0.3s;" onmouseover="this.style.color='#0E7A5F'" onmouseout="this.style.color='#666'">Disclaimer</a>
  <a href="/privacy-policy/" style="color: #666; text-decoration: none; transition: color 0.3s;" onmouseover="this.style.color='#0E7A5F'" onmouseout="this.style.color='#666'">Kebijakan Privasi</a>
</div>

<script>
  document.addEventListener("DOMContentLoaded", function() {
    // Memindahkan tautan ke atas tulisan Copyright (ke dalam tag <footer> tema)
    var customLinks = document.getElementById("custom-footer-links");
    var themeFooter = document.querySelector(".footer");
    if (customLinks && themeFooter) {
      themeFooter.insertBefore(customLinks, themeFooter.firstChild);
    }
  });
</script>
