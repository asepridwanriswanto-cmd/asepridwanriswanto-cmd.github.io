<!-- KODE TOMBOL SHARE MURNI JAVASCRIPT -->
<div id="custom-share-container" style="display: none; max-width: 800px; margin: 50px auto 20px auto; padding: 20px; border-top: 1px solid #eee; text-align: center;">
  <p style="font-size: 0.9em; color: #666; margin-bottom: 15px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px;">Bagikan Halaman Ini:</p>
  <div style="display: flex; justify-content: center; flex-wrap: wrap; gap: 10px;">
    <!-- Tambahan data-no-instant agar tidak dicegat oleh tema -->
    <a id="share-wa" href="#" data-no-instant target="_blank" rel="noopener noreferrer" style="display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; background: #ffffff; color: #555555; text-decoration: none; border: 1px solid #dddddd; border-radius: 20px; font-size: 0.85em; font-weight: 600; transition: all 0.3s ease;">💬 WhatsApp</a>
    
    <a id="share-fb" href="#" data-no-instant target="_blank" rel="noopener noreferrer" style="display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; background: #ffffff; color: #555555; text-decoration: none; border: 1px solid #dddddd; border-radius: 20px; font-size: 0.85em; font-weight: 600; transition: all 0.3s ease;">🔵 Facebook</a>
    
    <a id="share-x" href="#" data-no-instant target="_blank" rel="noopener noreferrer" style="display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; background: #ffffff; color: #555555; text-decoration: none; border: 1px solid #dddddd; border-radius: 20px; font-size: 0.85em; font-weight: 600; transition: all 0.3s ease;">𝕏 X / Twitter</a>
    
    <a id="share-tg" href="#" data-no-instant target="_blank" rel="noopener noreferrer" style="display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; background: #ffffff; color: #555555; text-decoration: none; border: 1px solid #dddddd; border-radius: 20px; font-size: 0.85em; font-weight: 600; transition: all 0.3s ease;">✈️ Telegram</a>
    
    <a id="share-th" href="#" data-no-instant target="_blank" rel="noopener noreferrer" style="display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; background: #ffffff; color: #555555; text-decoration: none; border: 1px solid #dddddd; border-radius: 20px; font-size: 0.85em; font-weight: 600; transition: all 0.3s ease;">🧵 Threads</a>
  </div>
</div>

<script>
  document.addEventListener("DOMContentLoaded", function() {
    const path = window.location.pathname;
    const targetPages = ["/jadwal-sholat/", "/waris/", "/hadits/", "/dzikir/", "/doa/", "/kiblat/", "/kalender-islam/"];
    const isTargetPage = targetPages.some(page => path.includes(page));

    if (isTargetPage) {
      const container = document.getElementById("custom-share-container");
      if (container) container.style.display = "block";

      const pUrl = encodeURIComponent(window.location.href);
      const pTitle = encodeURIComponent(document.title);
      
      document.getElementById("share-wa").href = "https://wa.me/?text=" + pTitle + "%20" + pUrl;
      document.getElementById("share-fb").href = "https://www.facebook.com/sharer/sharer.php?u=" + pUrl;
      document.getElementById("share-x").href = "https://twitter.com/intent/tweet?text=" + pTitle + "&url=" + pUrl;
      document.getElementById("share-tg").href = "https://t.me/share/url?url=" + pUrl + "&text=" + pTitle;
      document.getElementById("share-th").href = "https://threads.net/intent/post?text=" + pTitle + "%20" + pUrl;

      // Memindahkan posisi ke atas footer (Opsional, tapi ini memperbaikinya)
      const footer = document.querySelector(".footer");
      if (footer && container) {
        footer.parentNode.insertBefore(container, footer);
      }
    }
  });
</script>
